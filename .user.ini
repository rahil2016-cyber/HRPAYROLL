; HR Allocate — PHP-FPM per-directory configuration
; This file is read by PHP-FPM (unlike .htaccess php_value which only works with mod_php).
; Required so company onboarding base64 image payloads are accepted by the server.
post_max_size = 32M
upload_max_filesize = 32M
memory_limit = 128M
max_execution_time = 120
max_input_time = 120
